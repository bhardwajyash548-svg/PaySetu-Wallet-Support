# Render Blueprint for PaySetu Wallet Support (Streamlit app).
# Secrets are NOT stored here: Render asks for GOOGLE_API_KEY, APP_PASSCODE and ADMIN_PASSCODE
# when you create the Blueprint (sync: false), and keeps them private.
services:
  - type: web
    name: paysetu-wallet-support
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GOOGLE_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
      - key: ADMIN_PASSCODE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
